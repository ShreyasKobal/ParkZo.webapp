  <!-- ============ LOGIN SECTION ============ -->
  <main class="auth-container">
    <div class="auth-card">

      <h2>Welcome back !</h2>
      <p class="auth-subtext">Log in to manage your parking easily</p>

      <form id="loginForm" class="auth-form">
        <div class="input-group">
          <label>Email</label>
          <input type="email" placeholder="you@example.com" required>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        
        </div>

        <div class="auth-row">
          <label class="show-password">
          <input type="checkbox" id="showPassword">
          Show password
          </label>
          <a href="forgot-password.html" class="link">Forgot password?</a>
        </div>

       <button type="submit" class="auth-btn">Log in</button>

        <div class="divider">OR</div>

        <button type="button" id="googleLoginBtn" class="auth-btn google-btn">
          <i class="fab fa-google"></i> Continue with Google
        </button>
        
      </form>
  
      <p class="auth-footer">
        Don’t have an account?
        <a href="signup.html" class="link">Create one</a>
      </p>

    </div>
  </main>
  
  <script src="js/auth.js"></script>
</script>
