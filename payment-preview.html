        <!-- CENTER SECTION -->

        <main>

          <div class="preview-page">

      <div class="preview-card">
        <h2>Available Parking</h2>

        <!-- Location -->
        <div class="preview-row">
          <span class="label">Location</span>
          <span class="value" id="previewLocation"></span>

        <!-- Time -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

  <script>
   
  const bookingLocation = sessionStorage.getItem("bookingLocation");
  const timeRange = sessionStorage.getItem("timeRange");
  const amountPaid = sessionStorage.getItem("amountPaid");
  const bookingDate = sessionStorage.getItem("bookingDate");

  if (!bookingLocation || !timeRange || !amountPaid || !bookingDate) {
    alert("Booking data missing. Please book again.");
    window.location.href = "booking.html";
  }

  document.getElementById("previewLocation").innerText = bookingLocation;
  document.getElementById("previewTime").innerText = `${bookingDate} | ${timeRange}`;
  document.getElementById("previewVehicle").innerText =
    amountPaid % 30 === 0 ? "4 Wheeler" : "2 Wheeler";
  document.getElementById("previewPrice").innerText = `₹${amountPaid}`;


  </script>

    <script>
    document.getElementById("payNowBtn").addEventListener("click", async () => {
      const bookingId = sessionStorage.getItem("bookingId");

      if (!bookingId) {
        alert("Booking not found");
        return;
      }

      const { error } = await supabaseClient
        .from("parking_bookings")
        .update({
          payment_status: "paid",
          payment_time: new Date().toISOString()
        })
        .eq("id", bookingId);

      if (error) {
        alert("Payment failed");
        console.error(error);
        return;
      }

      // clear temp storage
      sessionStorage.clear();

      // redirect to success page
      window.location.href = "payment-success.html";
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
